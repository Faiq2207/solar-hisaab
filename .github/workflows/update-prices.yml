name: Update solar prices daily
on:
  schedule:
    - cron: "0 4 * * *"   # 9:00 AM Pakistan time, every day
  workflow_dispatch:
  push:
    paths:
      - "solar-hisaab.zip"
      - "build_pages.py"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded zip (first setup only)
        run: |
          if [ -f solar-hisaab.zip ]; then
            unzip -o -q solar-hisaab.zip -d /tmp/u
            rm -rf /tmp/u/solar-hisaab/.github
            cp -r /tmp/u/solar-hisaab/. .
            git rm -q solar-hisaab.zip
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python update_prices.py
      - run: python build_pages.py
      - name: Save changes
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily price update"
          git push
